<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NozStream - Nonton Gratis</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  <script src="assets/js/main.js" defer></script>
</head>
<body class="bg-zinc-950 text-white dark transition-colors duration-300">
  <nav class="bg-black/90 backdrop-blur-md border-b border-zinc-800 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <span class="text-4xl font-bold text-red-600">Noz</span>
        <span class="text-4xl font-light">Stream</span>
      </div>
      <div class="flex items-center gap-8 font-medium hidden md:flex">
        <a href="index.html" class="text-red-500">Home</a>
        <a href="browse.html" class="hover:text-red-500 transition">Browse</a>
        <a href="search.html" class="hover:text-red-500 transition">Search</a>
        <button onclick="toggleTheme()" id="themeToggle" class="w-10 h-10 flex items-center justify-center rounded-xl hover:bg-zinc-800 transition">
          <i class="fas fa-moon text-xl"></i>
        </button>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-6 py-10">
    <div id="homeLoader" class="flex justify-center py-20">
      <div class="animate-spin w-12 h-12 border-4 border-red-600 border-t-transparent rounded-full"></div>
    </div>

    <div id="latest-section" class="mb-14"></div>
    <div id="trending-section"></div>
  </main>

  <footer class="py-10 text-center text-zinc-600 text-sm border-t border-zinc-900 mt-10">
    <p>NozStream • Built with ❤️ for educational use</p>
  </footer>

  <script>
    window.onload = () => {
      loadTheme();
      // Panggil API Home lalu sembunyikan loader
      loadHome().then(() => {
        const loader = document.getElementById('homeLoader');
        if(loader) loader.classList.add('hidden');
      });
    };
  </script>
</body>
</html>
