<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NozStream - Nonton Video Terbaru</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="assets/js/main.js" defer></script>
  <style>
    .hero-bg {
      background: linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.85)), url('https://images.unsplash.com/photo-1489599849927-8ee9e8d5e2c7?w=1200') center/cover no-repeat;
    }
    .light .hero-bg {
      background: linear-gradient(rgba(255,255,255,0.9), rgba(255,255,255,0.95)), url('https://images.unsplash.com/photo-1489599849927-8ee9e8d5e2c7?w=1200') center/cover no-repeat;
    }
  </style>
</head>
<body class="bg-zinc-950 text-white dark">

  <!-- Navbar -->
  <nav class="bg-black/90 dark:bg-black/90 backdrop-blur-md border-b border-zinc-800 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <span class="text-4xl font-bold text-red-600">Noz</span>
        <span class="text-4xl font-light">Stream</span>
      </div>
      
      <div class="flex items-center gap-8">
        <a href="index.html" class="hover:text-red-500 transition">Home</a>
        <a href="browse.html" class="hover:text-red-500 transition">Browse</a>
        <a href="search.html" class="hover:text-red-500 transition">Search</a>
        
        <!-- Dark Mode Toggle -->
        <button onclick="toggleTheme()" id="themeToggle"
                class="w-10 h-10 flex items-center justify-center rounded-xl hover:bg-zinc-800 transition">
          <i class="fas fa-moon text-xl"></i>
        </button>
      </div>
    </div>
  </nav>

  <!-- Hero -->
  <section class="hero-bg h-screen flex items-center relative">
    <div class="max-w-7xl mx-auto px-6 text-center">
      <h1 class="text-6xl md:text-7xl font-bold tracking-tighter mb-6">
        Nonton Video<br><span class="text-red-500">Tanpa Ribet</span>
      </h1>
      <p class="text-xl md:text-2xl text-zinc-200 max-w-2xl mx-auto mb-10">
        Koleksi video terbaru, trending, dan berkualitas tinggi setiap hari.
      </p>
      <div class="flex justify-center gap-5">
        <a href="search.html" class="px-10 py-4 bg-red-600 hover:bg-red-700 rounded-2xl text-lg font-semibold transition">
          Mulai Nonton Sekarang
        </a>
        <a href="browse.html" class="px-10 py-4 border border-white/40 hover:border-white rounded-2xl text-lg font-semibold transition">
          Jelajahi Kategori
        </a>
      </div>
    </div>
  </section>

  <!-- Latest & Trending (sama seperti sebelumnya) -->
  <section class="py-16">
    <div class="max-w-7xl mx-auto px-6">
      <h2 class="text-3xl font-bold mb-8">Video Terbaru</h2>
      <div id="latest" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6"></div>
    </div>
  </section>

  <section class="py-16 bg-zinc-900 dark:bg-zinc-900">
    <div class="max-w-7xl mx-auto px-6">
      <h2 class="text-3xl font-bold mb-8 flex items-center gap-3">
        <i class="fas fa-fire text-orange-500"></i> Trending Saat Ini
      </h2>
      <div id="trending" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6"></div>
    </div>
  </section>

  <footer class="bg-black py-12 text-center text-zinc-500">
    <p>© 2026 NozStream • Professional Video Streaming</p>
  </footer>

  <script>
    // Toggle Dark / Light Mode
    function toggleTheme() {
      const html = document.documentElement;
      const isDark = html.classList.contains('dark');
      
      if (isDark) {
        html.classList.remove('dark');
        localStorage.setItem('theme', 'light');
        document.getElementById('themeToggle').innerHTML = `<i class="fas fa-sun text-xl"></i>`;
      } else {
        html.classList.add('dark');
        localStorage.setItem('theme', 'dark');
        document.getElementById('themeToggle').innerHTML = `<i class="fas fa-moon text-xl"></i>`;
      }
    }

    // Load theme saat halaman dibuka
    function loadTheme() {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'light') {
        document.documentElement.classList.remove('dark');
        document.getElementById('themeToggle').innerHTML = `<i class="fas fa-sun text-xl"></i>`;
      }
    }

    // Load konten
    window.onload = () => {
      loadTheme();
      loadHome();
    };
  </script>
</body>
</html>
