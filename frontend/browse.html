<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse - Noz Stream</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="assets/js/main.js"></script>
</head>
<body class="bg-zinc-950 text-white">
  <nav class="bg-black sticky top-0 z-50 border-b border-zinc-800">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
      <h1 class="text-3xl font-bold text-red-600">Noz<span class="text-white">Stream</span></h1>
      <a href="index.html" class="hover:text-red-500">← Kembali</a>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-4 py-8">
    <h2 id="categoryTitle" class="text-2xl font-bold mb-6 capitalize"></h2>
    <div id="videoContainer" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6"></div>
    <div id="loader" class="hidden flex justify-center py-10">
      <div class="animate-spin w-10 h-10 border-4 border-red-600 border-t-transparent rounded-full"></div>
    </div>
    <div id="sentinel" class="h-10"></div>
  </main>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const slug = urlParams.get('slug');

    if (slug) {
      document.getElementById('categoryTitle').textContent = slug.replace('-', ' ');
      currentType = 'category';
      currentSlug = slug;
      resetInfinite();
      loadMore();
      initInfiniteScroll();
    }
  </script>
</body>
</html>
