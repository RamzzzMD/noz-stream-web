<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search - NozStream</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="assets/js/main.js" defer></script>
</head>
<body class="bg-zinc-950 text-white dark">
  <nav class="bg-black/90 backdrop-blur-md border-b border-zinc-800 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-5 flex justify-between items-center">
      <div class="flex items-center gap-3">
        <span class="text-4xl font-bold text-red-600">Noz</span>
        <span class="text-4xl font-light">Stream</span>
      </div>
      <div class="flex items-center gap-8">
        <a href="index.html" class="hover:text-red-500">Home</a>
        <a href="browse.html" class="hover:text-red-500">Browse</a>
        <a href="search.html" class="text-red-500">Search</a>
        <button onclick="toggleTheme()" id="themeToggle" class="w-10 h-10 flex items-center justify-center rounded-xl hover:bg-zinc-800">
          <i class="fas fa-moon"></i>
        </button>
      </div>
    </div>
  </nav>

  <main class="max-w-7xl mx-auto px-6 py-10">
    <div class="max-w-2xl mx-auto mb-10">
      <div class="relative">
        <input id="searchInput" type="text" placeholder="Cari judul atau keyword..." 
               class="w-full bg-zinc-900 border border-zinc-700 focus:border-red-600 rounded-2xl py-5 px-6 text-lg outline-none">
        <button onclick="performSearch()" class="absolute right-4 top-1/2 -translate-y-1/2 bg-red-600 hover:bg-red-700 px-8 py-3 rounded-xl">
          <i class="fas fa-search"></i>
        </button>
      </div>
    </div>

    <h2 id="searchResultTitle" class="text-2xl font-bold mb-6">Hasil Pencarian</h2>
    <div id="videoContainer" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6"></div>
    <div id="loader" class="hidden flex justify-center py-12">
      <div class="animate-spin w-10 h-10 border-4 border-red-600 border-t-transparent rounded-full"></div>
    </div>
    <div id="sentinel" class="h-12"></div>
  </main>

  <script>
    window.onload = () => {
      loadTheme();
      document.getElementById('searchInput').focus();
    };
  </script>
</body>
</html>
